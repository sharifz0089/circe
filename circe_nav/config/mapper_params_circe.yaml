# slam_toolbox (async) parameters for the CIRCE rover.
#
# Derived from slam_toolbox's mapper_params_online_async.yaml, with the values
# that are actually specific to this robot called out below. Everything not
# commented is the upstream default, kept explicit so tuning has a baseline.
#
# The node name must stay 'slam_toolbox' to match this top-level key.
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    # CIRCE: rover_4wd.urdf roots the model at base_link. There is no
    # base_footprint link, so the upstream default would never resolve.
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05

    # CIRCE: RPLidar A1 is a 0.15 - 12.0 m sensor. Leaving max_laser_range at the
    # upstream 20.0 makes slam_toolbox raytrace free space out to 20 m along every
    # beam, carving away unobserved cells and producing a map that claims open
    # floor where the lidar simply had no return.
    min_laser_range: 0.15
    max_laser_range: 12.0

    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # CIRCE: the Zero 4WD is a small platform and the A1 is low resolution, so
    # nodes are added more often than the 0.5 m / 0.5 rad upstream default to
    # keep the pose graph dense enough for loop closure indoors.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    # CIRCE: matched to the A1's real max range rather than the 10.0 default.
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
